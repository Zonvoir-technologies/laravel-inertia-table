name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, iconv
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint check (Laravel Pint)
        run: vendor/bin/pint --test

      - name: Run PHP tests
        run: composer test

  vue:
    name: Vue Adapter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vue

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: vue/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run Vitest tests
        run: npm run test

      - name: Build production distribution
        run: npm run build

      - name: Verify declared export targets exist
        run: |
          test -f dist/zonvoir-table.js || { echo "Missing dist/zonvoir-table.js"; exit 1; }
          test -f dist/zonvoir-table.cjs || { echo "Missing dist/zonvoir-table.cjs"; exit 1; }
          test -f dist/index.d.ts || { echo "Missing dist/index.d.ts"; exit 1; }

      - name: Packaging dry-run
        run: npm pack --dry-run

  docs:
    name: Documentation Site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.html || { echo "Missing dist/index.html"; exit 1; }
          test -f dist/404.html || { echo "Missing dist/404.html"; exit 1; }
          test -f dist/llms.txt || { echo "Missing dist/llms.txt"; exit 1; }
          test -f dist/sitemap-index.xml || { echo "Missing dist/sitemap-index.xml"; exit 1; }

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: docs/dist/
          retention-days: 7

  release-readiness:
    name: Release Readiness
    needs: [php, vue, docs]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify LICENSE files exist
        run: |
          test -f LICENSE || { echo "Missing root LICENSE file"; exit 1; }
          test -f vue/LICENSE || { echo "Missing vue/LICENSE file"; exit 1; }

      - name: Verify SPDX Apache-2.0 license declarations
        run: |
          grep -q '"license": "Apache-2.0"' composer.json || { echo "composer.json license is not Apache-2.0"; exit 1; }
          grep -q '"license": "Apache-2.0"' vue/package.json || { echo "vue/package.json license is not Apache-2.0"; exit 1; }

      - name: Verify canonical package names
        run: |
          grep -q '"name": "zonvoir/laravel-inertia-table"' composer.json || { echo "composer.json name is incorrect"; exit 1; }
          grep -q '"name": "@zonvoir/inertia-table-vue"' vue/package.json || { echo "vue/package.json name is incorrect"; exit 1; }

      - name: Verify release version script logic
        run: |
          node scripts/verify-release-version.mjs v0.1.0

      - name: Assert no legacy namespace references
        run: |
          if git grep -i "Zonvoir\\\\ZonvoirTable" -- ':!.github'; then
            echo "Found legacy Zonvoir\\ZonvoirTable namespace references!"
            exit 1
          fi

      - name: Assert no legacy package references
        run: |
          if git grep "zonvoir/zonvoir-table" -- ':!.github'; then
            echo "Found legacy zonvoir/zonvoir-table package references!"
            exit 1
          fi

      - name: Assert hero image size is optimized (< 500 KB)
        run: |
          node -e '
            const fs = require("fs");
            const file = "docs/public/hero-section-dark.webp";
            if (!fs.existsSync(file)) {
              console.error("Missing " + file);
              process.exit(1);
            }
            const size = fs.statSync(file).size;
            console.log(`Hero image size: ${Math.round(size / 1024)} KB`);
            if (size >= 500 * 1024) {
              console.error("Hero image exceeds 500 KB limit!");
              process.exit(1);
            }
          '

  deploy-docs:
    name: Deploy Documentation
    needs: [docs, release-readiness]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Download built docs
        uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: dist

      - name: Deploy to Server via SSH
        env:
          DOCS_SSH_HOST: ${{ secrets.DOCS_SSH_HOST }}
          DOCS_SSH_USER: ${{ secrets.DOCS_SSH_USER }}
          DOCS_SSH_KEY: ${{ secrets.DOCS_SSH_KEY }}
          DOCS_SSH_PORT: ${{ secrets.DOCS_SSH_PORT || '22' }}
          DOCS_DEPLOY_PATH: ${{ secrets.DOCS_DEPLOY_PATH }}
        run: |
          if [ -z "$DOCS_SSH_HOST" ] || [ -z "$DOCS_SSH_USER" ] || [ -z "$DOCS_SSH_KEY" ] || [ -z "$DOCS_DEPLOY_PATH" ]; then
            echo "::notice ::Deployment secrets (DOCS_SSH_HOST, DOCS_SSH_USER, DOCS_SSH_KEY, DOCS_DEPLOY_PATH) are not configured. Skipping server deployment."
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$DOCS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DOCS_SSH_PORT" -H "$DOCS_SSH_HOST" >> ~/.ssh/known_hosts

          RELEASE_ID="$(date +%Y%m%d-%H%M%S)"
          RELEASE_DIR="$DOCS_DEPLOY_PATH/releases/$RELEASE_ID"

          echo "==> Creating release directory on server: $RELEASE_DIR"
          ssh -i ~/.ssh/deploy_key -p "$DOCS_SSH_PORT" "$DOCS_SSH_USER@$DOCS_SSH_HOST" "mkdir -p '$RELEASE_DIR'"

          echo "==> Uploading static files..."
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -p $DOCS_SSH_PORT" --delete dist/ "$DOCS_SSH_USER@$DOCS_SSH_HOST:$RELEASE_DIR/"

          echo "==> Switching symlink atomically..."
          ssh -i ~/.ssh/deploy_key -p "$DOCS_SSH_PORT" "$DOCS_SSH_USER@$DOCS_SSH_HOST" "ln -sfn '$RELEASE_DIR' '$DOCS_DEPLOY_PATH/current' && cd '$DOCS_DEPLOY_PATH/releases' && ls -1dt * | tail -n +6 | xargs -r rm -rf"

          echo "==> Deployment of release $RELEASE_ID completed successfully!"
