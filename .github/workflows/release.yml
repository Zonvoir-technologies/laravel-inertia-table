name: Release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish-vue:
    name: Validate and Publish Vue Package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHP Lint check (Laravel Pint)
        run: vendor/bin/pint --test

      - name: Run PHP test suite
        run: composer test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vue/package-lock.json

      - name: Ensure npm CLI 11.5.1+ for Trusted Publishing
        run: |
          echo "Current Node version: $(node -v)"
          echo "Current npm version: $(npm -v)"
          node -e '
            const [major, minor] = process.versions.node.split(".").map(Number);
            if (major < 22 || (major === 22 && minor < 14)) {
              console.error(`Node 22.14.0+ required for OIDC Trusted Publishing, found ${process.version}`);
              process.exit(1);
            }
          '
          npm install -g npm@latest
          echo "Upgraded npm version: $(npm -v)"

      - name: Verify release version matches Git tag
        run: node scripts/verify-release-version.mjs "${{ github.ref_name }}"

      - name: Install Vue dependencies
        working-directory: vue
        run: npm ci

      - name: Vue Typecheck
        working-directory: vue
        run: npm run typecheck

      - name: Vue Lint
        working-directory: vue
        run: npm run lint

      - name: Run Vitest test suite
        working-directory: vue
        run: npm run test

      - name: Build Vue production distribution
        working-directory: vue
        run: npm run build

      - name: Verify declared export targets exist
        working-directory: vue
        run: |
          test -f dist/zonvoir-table.js || { echo "Missing dist/zonvoir-table.js"; exit 1; }
          test -f dist/zonvoir-table.cjs || { echo "Missing dist/zonvoir-table.cjs"; exit 1; }
          test -f dist/index.d.ts || { echo "Missing dist/index.d.ts"; exit 1; }

      - name: Inspect npm tarball dry-run
        working-directory: vue
        run: npm pack --dry-run

      - name: Publish Vue package to npm with OIDC provenance
        working-directory: vue
        run: npm publish --access public --provenance
